<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫療法規標準查詢器</title>
  <style>
    :root{--ink:#172033;--muted:#66758a;--line:#dfe6ee;--bg:#f5f7fa;--brand:#116b68;--brand2:#e2f4f1;--gold:#f4c95d;--shadow:0 8px 22px #21354712}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}.shell{max-width:1280px;margin:auto;padding:26px 22px 60px}
    .hero{background:linear-gradient(135deg,#123f4b,#137970);border-radius:20px;color:#fff;padding:30px 34px;box-shadow:var(--shadow)}.eyebrow{font-size:13px;letter-spacing:.12em;opacity:.78}.hero h1{margin:8px 0;font-size:30px}.hero p{margin:0;color:#d9f0ed}.search{display:flex;gap:10px;margin-top:24px}.search input{flex:1;min-width:0;border:0;border-radius:10px;padding:14px 16px;font-size:16px}.button{border:0;border-radius:9px;padding:0 20px;background:var(--gold);color:#27313b;font-weight:700;cursor:pointer}.button.light{background:#fff;color:var(--brand);padding:10px 14px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat,.panel,.category,.result{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #21354708}.stat{padding:16px}.stat strong{display:block;font-size:25px}.stat span{font-size:13px;color:var(--muted)}
    .panel{padding:20px;margin-bottom:22px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel-title h2{font-size:18px;margin:0}.hint{font-size:13px;color:var(--muted)}.filter-row{display:flex;flex-wrap:wrap;gap:10px}.filter-row select{min-width:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
    .columns{display:grid;grid-template-columns:1.45fr 1fr;gap:22px}.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.category{border:1px solid var(--line);padding:14px;text-align:left;cursor:pointer;min-height:72px;transition:.15s}.category:hover,.category.active{border-color:var(--brand);background:var(--brand2);transform:translateY(-1px)}.category strong{display:block;line-height:1.4;font-size:14px}.category span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.subgrid{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;color:var(--ink);cursor:pointer}.chip:hover,.chip.active{border-color:var(--brand);background:var(--brand2);color:#075d59}.empty-small{color:var(--muted);font-size:13px;padding:12px 0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.toolbar strong{font-size:18px}.toolbar small{color:var(--muted)}.result{padding:17px;margin:10px 0}.result h3{font-size:16px;line-height:1.45;margin:0 0 9px}.result p{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-all;margin:7px 0}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border-radius:5px;padding:4px 7px;background:var(--brand2);color:#075d59;font-size:12px}.tag.warn{background:#fff3d0;color:#795b00}.pager{display:flex;justify-content:center;gap:7px;margin-top:16px}.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}.pager button.active{background:var(--brand);border-color:var(--brand);color:#fff}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fff}
    @media(max-width:850px){.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.category-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.shell{padding:14px}.hero{padding:24px 18px}.hero h1{font-size:25px}.search{flex-direction:column}.search .button{height:45px}.category-grid{grid-template-columns:1fr}.filter-row select{width:100%}}
  </style>
</head>
<body><div class="shell">
  <header class="hero"><div class="eyebrow">院內法規與標準資料庫</div><h1>先看分類，再找到文件</h1><p>第一層看醫療主題與文件類型，第二層用地區或年份縮小範圍，最後再搜尋文件。</p><div class="search"><input id="q" placeholder="例如：感染、病歷、護理、醫院評鑑"><button class="button" id="searchBtn">搜尋文件</button></div></header>
  <section class="stats" id="stats"></section>
  <section class="panel"><div class="panel-title"><h2>目前篩選</h2><button class="button light" id="clearBtn">清除全部</button></div><div class="filter-row"><select id="jurisdiction"><option value="">全部法域</option></select><select id="documentType"><option value="">全部文件類型</option></select><select id="topic"><option value="">全部醫療主題</option></select><select id="region"><option value="">全部地區／省份</option></select><select id="year"><option value="">全部年份</option></select></div></section>
  <section class="columns"><div class="panel"><div class="panel-title"><h2>第一層：醫療主題</h2><span class="hint">點選分類</span></div><div class="category-grid" id="topics"></div></div><div class="panel"><div class="panel-title"><h2>第一層：文件類型</h2><span class="hint">點選分類</span></div><div class="category-grid" id="types"></div></div></section>
  <section class="panel"><div class="panel-title"><h2>第二層：地區／省份</h2><span class="hint">依目前第一層篩選顯示</span></div><div class="subgrid" id="regions"></div><div class="panel-title" style="margin-top:20px"><h2>第二層：年份</h2><span class="hint">依文件名稱與標準號辨識</span></div><div class="subgrid" id="years"></div></section>
  <section><div class="toolbar"><div><strong>文件結果</strong> <small id="summary"></small></div><span class="hint">每頁 20 筆</span></div><div id="results"></div><div class="pager" id="pager"></div></section>
</div><script>
  const state={filters:{jurisdiction:'',documentType:'',topic:'',region:'',year:'',q:''},page:1,results:[],base:{},detail:{}};const $=id=>document.getElementById(id);const pageSize=20;
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function params(includeSecond=true){const p=new URLSearchParams();for(const[key,value]of Object.entries(state.filters)){if(value&&(includeSecond||!['topic','region','year'].includes(key)))p.set(key,value)}return p}
  async function get(path){return await(await fetch(path)).json()}
  function populateSelect(id,values,label){const el=$(id),current=state.filters[id];el.innerHTML='<option value="">'+label+'</option>';for(const[value,count]of Object.entries(values)){const o=document.createElement('option');o.value=value;o.textContent=value+' ('+count+')';el.appendChild(o)}el.value=current}
  function cards(id,values,key,limit=30){const el=$(id);el.innerHTML=Object.entries(values).slice(0,limit).map(([name,count])=>'<button class="category '+(state.filters[key]===name?'active':'')+'" data-key="'+esc(key)+'" data-value="'+esc(name)+'"><strong>'+esc(name)+'</strong><span>'+count+' 份文件</span></button>').join('')||'<div class="empty-small">目前沒有可顯示的分類</div>';el.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{state.filters[btn.dataset.key]=state.filters[btn.dataset.key]===btn.dataset.value?'':btn.dataset.value;state.filters.region='';state.filters.year='';state.page=1;refresh()}))}
  function chips(id,values,key){const el=$(id);el.innerHTML=Object.entries(values).slice(0,40).map(([name,count])=>'<button class="chip '+(state.filters[key]===name?'active':'')+'" data-key="'+esc(key)+'" data-value="'+esc(name)+'">'+esc(name)+' · '+count+'</button>').join('')||'<div class="empty-small">目前沒有可辨識資料</div>';el.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{state.filters[btn.dataset.key]=state.filters[btn.dataset.key]===btn.dataset.value?'':btn.dataset.value;state.page=1;refresh()}))}
  function renderStats(f){$('stats').innerHTML='<div class="stat"><strong>'+f.total+'</strong><span>目前範圍文件</span></div><div class="stat"><strong>'+(f.jurisdiction.TW||0)+'</strong><span>台灣資料</span></div><div class="stat"><strong>'+(f.jurisdiction.CN||0)+'</strong><span>中國大陸資料</span></div><div class="stat"><strong>'+f.review+'</strong><span>待人工確認</span></div>'}
  function renderResults(){const rows=state.results.slice((state.page-1)*pageSize,state.page*pageSize);$('summary').textContent='（共 '+state.results.length+' 筆）';$('results').innerHTML=rows.length?rows.map(x=>'<article class="result"><h3>'+esc(x.fileName)+'</h3><div class="tags"><span class="tag">'+esc(x.jurisdiction==='TW'?'台灣':x.jurisdiction==='CN'?'中國大陸':'法域待確認')+'</span><span class="tag">'+esc(x.documentType)+'</span><span class="tag">'+esc(x.primaryTopic)+'</span><span class="tag">'+esc(x.region)+'</span><span class="tag">'+esc(x.year)+'</span>'+(x.classificationStatus==='needs_review'?'<span class="tag warn">待人工確認</span>':'')+'</div><p>'+esc(x.relativePath)+'</p><p>最後修改：'+esc(new Date(x.modifiedAt).toLocaleDateString())+'　分類信心：'+esc(x.confidence)+'</p></article>').join(''):'<div class="empty">沒有符合條件的文件，請清除篩選或換一組條件。</div>';const pages=Math.ceil(state.results.length/pageSize);$('pager').innerHTML=pages>1?Array.from({length:pages},(_,i)=>'<button class="'+(state.page===i+1?'active':'')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>').join(''):'';$('pager').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);renderResults();window.scrollTo({top:$('results').offsetTop-20,behavior:'smooth'})})}
  async function refresh(){const base=await get('/api/facets?'+params(false));const detail=await get('/api/facets?'+params(true));state.base=base;state.detail=detail;renderStats(detail);populateSelect('jurisdiction',base.jurisdiction,'全部法域');populateSelect('documentType',base.documentType,'全部文件類型');populateSelect('topic',base.primaryTopic,'全部醫療主題');populateSelect('region',detail.region,'全部地區／省份');populateSelect('year',detail.year,'全部年份');cards('topics',base.primaryTopic,'topic');cards('types',base.documentType,'documentType');chips('regions',detail.region,'region');chips('years',detail.year,'year');state.results=(await get('/api/search?'+params(true))).results;renderResults()}
  function clear(){state.filters={jurisdiction:'',documentType:'',topic:'',region:'',year:'',q:''};$('q').value='';state.page=1;refresh()}
  ['jurisdiction','documentType','topic','region','year'].forEach(id=>$(id).addEventListener('change',()=>{state.filters[id]=$(id).value;state.page=1;refresh()}));$('searchBtn').onclick=()=>{state.filters.q=$('q').value.trim();state.page=1;refresh()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});$('clearBtn').onclick=clear;refresh();
</script></body></html>
