<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫療法規查詢器</title>
  <style>
    :root{--blue:#0756a0;--blue2:#0b6fc8;--line:#ffffff45;--white:#fff;--muted:#d8eaff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#04366d,#0875cf);color:var(--white);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:30px 22px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.brand{display:flex;gap:14px;align-items:center}.mark{display:grid;place-items:center;width:48px;height:48px;border:2px solid #fff;border-radius:14px;font-size:25px;font-weight:900}.brand h1{font-size:25px;margin:0}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}.health{font-size:13px;color:var(--muted)}.health i{display:inline-block;width:8px;height:8px;background:#6df0b0;border-radius:50%;margin-right:6px}.hero{margin-bottom:20px}.hero h2{font-size:20px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.steps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.step{border:1px solid var(--line);border-radius:16px;padding:18px;background:#ffffff16}.step.active{background:#fff;color:#064884}.step b{display:block;font-size:13px;margin-bottom:8px;opacity:.9}.step strong{font-size:18px}.departments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:25px}.dept,.year{border:1px solid #ffffff66;border-radius:10px;background:#ffffff14;color:#fff;padding:12px 10px;text-align:left;cursor:pointer;font:inherit}.dept:hover,.year:hover,.dept.active,.year.active{background:#fff;color:#064884}.dept span,.year span{display:block;font-size:12px;opacity:.75;margin-top:3px}.years{display:flex;flex-wrap:wrap;gap:9px;min-height:48px}.years .hint{color:var(--muted);padding:12px 0}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;border:1px solid #ffffff66;border-radius:10px;padding:12px 14px;background:#ffffff;color:#123;font:inherit;outline:none}.search button,.reset{border:0;border-radius:10px;background:#082f5e;color:#fff;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}.search button:hover,.reset:hover{background:#001f45}.panel{border:1px solid var(--line);border-radius:16px;background:#ffffff12;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.panel h2{font-size:18px;margin:0}.summary{color:var(--muted);font-size:13px}.result{border-top:1px solid var(--line);padding:15px 0}.result:first-child{border-top:0}.result h3{font-size:16px;line-height:1.45;margin:0 0 8px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border:1px solid #ffffff55;border-radius:99px;padding:4px 8px;color:var(--muted);font-size:12px}.tag.main{background:#fff;color:#064884;border-color:#fff}.path,.meta{color:var(--muted);font-size:12px;line-height:1.5;word-break:break-all}.open{float:right;border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}.open:hover{background:#fff;color:#064884}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none}@media(max-width:800px){.departments{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.app{padding:20px 14px}.top{display:block}.health{margin-top:12px}.steps{grid-template-columns:1fr}.departments{grid-template-columns:1fr 1fr}.search{flex-wrap:wrap}.search input{flex-basis:100%;height:44px}.search button{height:44px;flex:1}.reset{height:44px;flex:1}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand"><div class="mark">法</div><div><h1>醫療法規查詢器</h1><p>先選科別，再選年份，快速找到原始文件</p></div></div><div class="health"><i></i><span id="health">資料載入中</span></div></header>
  <section class="hero"><h2>簡易查詢</h2><p>請依序完成下面兩步；關鍵字可留空。</p></section>
  <section class="steps"><div id="step1" class="step active"><b>STEP 1</b><strong>選擇科別</strong></div><div id="step2" class="step"><b>STEP 2</b><strong id="chosen">再選年份</strong></div></section>
  <section id="departments" class="departments"></section>
  <section id="yearBox" class="hidden"><div class="years" id="years"></div></section>
  <form class="search" id="searchForm"><input id="q" placeholder="可選：輸入法規名稱、關鍵字或標準號"><button type="submit">搜尋</button><button type="button" class="reset" id="reset">重新選擇</button></form>
  <section class="panel"><div class="panel-head"><h2 id="resultTitle">請先選擇科別與年份</h2><span class="summary" id="summary"></span></div><div id="results"><div class="empty">選擇科別後，這裡會顯示可用年份。</div></div></section>
</main><script>
const state={category:'',year:'',q:''};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path){const r=await fetch(path);if(!r.ok)throw Error(r.status);return r.json()}function query(){const p=new URLSearchParams();if(state.category)p.set('folderCategory',state.category);if(state.year)p.set('year',state.year);if(state.q)p.set('q',state.q);return p}
function renderDepartments(values){$('departments').innerHTML=Object.entries(values).map(([name,count])=>`<button type="button" class="dept ${state.category===name?'active':''}" data-category="${esc(name)}">${esc(name)}<span>${count} 份文件</span></button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>selectCategory(b.dataset.category))}
async function selectCategory(category){state.category=category;state.year='';$('chosen').textContent='再選年份';$('step1').classList.remove('active');$('step2').classList.add('active');$('yearBox').classList.remove('hidden');$('resultTitle').textContent='請選擇年份';$('results').innerHTML='<div class="empty">年份載入中…</div>';renderDepartments(window.folders);const f=await get('/api/facets?folderCategory='+encodeURIComponent(category));$('years').innerHTML=Object.entries(f.year).map(([year,count])=>`<button type="button" class="year" data-year="${esc(year)}">${esc(year)}<span>${count} 份文件</span></button>`).join('')||'<div class="hint">此科別沒有可辨識的年份。</div>';document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>selectYear(b.dataset.year))}
async function selectYear(year){state.year=year;$('chosen').textContent=state.category+'／'+year;document.querySelectorAll('.year').forEach(b=>b.classList.toggle('active',b.dataset.year===year));await refresh()}
async function refresh(){if(!state.category||!state.year)return;const p=query();const data=await get('/api/search?'+p);$('resultTitle').textContent=state.category+'／'+state.year;$('summary').textContent='共 '+data.total+' 筆';$('results').innerHTML=data.results.length?data.results.map(x=>`<article class="result"><button class="open" data-id="${esc(x.documentId)}">開啟原始檔</button><h3>${esc(x.title||x.fileName)}</h3><div class="tags"><span class="tag main">${esc(x.folderCategory)}</span><span class="tag">${esc(x.documentType)}</span><span class="tag">${esc(x.primaryTopic)}</span><span class="tag">${esc(x.jurisdiction==='TW'?'台灣':x.jurisdiction==='CN'?'中國大陸':x.jurisdiction==='INTL'?'國際':'法域待確認')}</span></div><div class="path">${esc(x.relativePath)}</div><div class="meta">${esc(x.extension.toUpperCase())} · 文字狀態：${esc(x.contentExtraction)}</div></article>`).join(''):'<div class="empty">找不到符合條件的文件，請換關鍵字。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>window.open('/api/file?id='+encodeURIComponent(b.dataset.id),'_blank','noopener'))}
async function init(){const [f,h]=await Promise.all([get('/api/facets'),get('/api/health')]);window.folders=f.folderCategory||{};renderDepartments(window.folders);$('health').textContent='索引 '+h.indexed+' 筆'}$('searchForm').onsubmit=e=>{e.preventDefault();state.q=$('q').value.trim();refresh()};$('reset').onclick=()=>location.reload();init().catch(()=>{$('health').textContent='服務未連線';$('results').innerHTML='<div class="empty">資料載入失敗，請重新整理頁面。</div>'});
</script></body></html>
