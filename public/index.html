<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫療法規標準查詢器</title>
  <style>
    :root{--ink:#18232d;--muted:#6d7a86;--line:#e4e9ee;--bg:#f6f8fa;--panel:#fff;--brand:#126b68;--brand-soft:#e8f5f2;--brand-dark:#0a514e;--warning:#9a6a00;--warning-bg:#fff5d9;--shadow:0 4px 18px #172b3d0b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1440px;margin:auto;padding:24px 28px 56px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--brand);color:#fff;font-size:21px;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.health{font-size:12px;color:var(--muted)}.health i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#43ad76;margin-right:5px}
    .searchbar{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);margin-bottom:16px}.searchbar input{flex:1;min-width:0;border:0;outline:0;padding:10px 12px;font-size:16px;color:var(--ink)}.searchbar input::placeholder{color:#a0abb4}.searchbar button,.button{border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;padding:0 20px}.searchbar button:hover,.button:hover{background:var(--brand-dark)}
    .stats{display:flex;gap:10px;margin-bottom:18px;overflow:auto}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;min-width:125px}.stat strong{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted);white-space:nowrap}.stat.review strong{color:var(--warning)}
    .layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}.sidebar,.content-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.sidebar{padding:18px;position:sticky;top:18px}.side-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.side-heading h2{font-size:15px;margin:0}.side-heading span{font-size:12px;color:var(--muted)}.topic-list{display:grid;gap:4px;max-height:calc(100vh - 220px);overflow:auto}.topic{display:flex;justify-content:space-between;gap:8px;border:0;border-radius:8px;background:transparent;text-align:left;padding:10px 9px;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}.topic:hover{background:#f2f6f7}.topic.active{background:var(--brand-soft);color:var(--brand-dark);font-weight:700}.topic span{color:var(--muted);font-size:12px}.topic.active span{color:var(--brand)}
    .content-panel{padding:18px}.filter-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.filter-head h2{font-size:15px;margin:0}.clear{border:0;background:transparent;color:var(--brand);cursor:pointer;font:inherit;font-size:13px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;outline:0}select:focus{border-color:var(--brand)}.active-filter{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 2px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--brand-soft);color:var(--brand-dark);font-size:12px}.pill button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0;font-size:15px;line-height:1}
    .result-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}.result-head h2{font-size:18px;margin:0}.result-head small{color:var(--muted)}.result{border-top:1px solid var(--line);padding:16px 2px}.result:first-child{border-top:0}.result-title{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.result h3{font-size:16px;line-height:1.45;margin:0 0 9px;word-break:break-word}.open{flex:0 0 auto;border:1px solid #b8d9d5;background:#fff;color:var(--brand-dark);border-radius:7px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.open:hover{background:var(--brand-soft)}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border-radius:5px;padding:4px 7px;background:#f0f3f5;color:#52616d;font-size:12px}.tag.main{background:var(--brand-soft);color:var(--brand-dark)}.tag.warn{background:var(--warning-bg);color:var(--warning)}.path{font-size:12px;color:var(--muted);line-height:1.5;margin:9px 0 0;word-break:break-all}.meta{color:#8a949d;font-size:12px;margin-top:6px}.empty{text-align:center;padding:52px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;margin-top:8px}.pager{display:flex;justify-content:center;gap:5px;margin-top:18px}.pager button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 11px;cursor:pointer}.pager button.active{background:var(--brand);border-color:var(--brand);color:#fff}
    @media(max-width:900px){.app{padding:18px}.layout{grid-template-columns:1fr}.sidebar{position:static}.topic-list{display:flex;overflow:auto;max-height:none;padding-bottom:2px}.topic{flex:0 0 auto;white-space:nowrap;background:#f4f7f8}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.app{padding:12px}.topbar{align-items:flex-start}.health{display:none}.searchbar{padding:7px;flex-wrap:wrap}.searchbar input{flex-basis:100%;padding:10px}.searchbar button{height:42px;width:100%}.filters{grid-template-columns:1fr}.result-title{display:block}.open{margin-bottom:10px}.stats{margin-right:-12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark">法</div><div><h1>醫療法規標準查詢器</h1><p>依主題分類，快速找到可追溯的原始文件</p></div></div><div class="health"><i></i><span id="healthText">索引載入中</span></div></header>
    <form class="searchbar" id="searchForm"><input id="q" autocomplete="off" placeholder="搜尋文件名稱、法規關鍵字或標準號，例如：感染、病歷、GBZ"><button type="submit">搜尋</button></form>
    <section class="stats" id="stats" aria-label="資料統計"></section>
    <div class="layout">
      <aside class="sidebar"><div class="side-heading"><h2>醫療主題</h2><span>依文件數排序</span></div><div class="topic-list" id="topics"></div></aside>
      <section class="content-panel"><div class="filter-head"><h2>篩選條件</h2><button class="clear" id="clearBtn" type="button">清除全部</button></div><div class="filters"><select id="jurisdiction"><option value="">全部法域</option></select><select id="documentType"><option value="">全部文件類型</option></select><select id="region"><option value="">全部地區／省份</option></select><select id="year"><option value="">全部年份</option></select></div><div class="active-filter" id="activeFilter"></div><div class="result-head"><h2>文件結果</h2><small id="summary">載入中…</small></div><div id="results"></div><div class="pager" id="pager"></div></section>
    </div>
  </main>
  <script>
    const state={filters:{jurisdiction:'',documentType:'',topic:'',region:'',year:'',q:''},page:1,results:[]};const pageSize=20;const $=id=>document.getElementById(id);
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function get(path){const response=await fetch(path);if(!response.ok)throw new Error('API '+response.status);return response.json()}
    function params(){const p=new URLSearchParams();Object.entries(state.filters).forEach(([key,value])=>{if(value)p.set(key,value)});return p}
    function label(key,value){if(key==='jurisdiction')return value==='TW'?'台灣':value==='CN'?'中國大陸':value==='UNKNOWN'?'法域待確認':value;if(key==='topic')return '主題：'+value;if(key==='documentType')return '類型：'+value;if(key==='region')return '地區：'+value;if(key==='year')return '年份：'+value;return value}
    function populate(id,values,first){const el=$(id),current=state.filters[id];el.innerHTML='<option value="">'+first+'</option>'+Object.entries(values).map(([v,c])=>'<option value="'+esc(v)+'">'+esc(v)+'（'+c+'）</option>').join('');el.value=current}
    function renderTopics(values){$('topics').innerHTML=Object.entries(values).map(([name,count])=>'<button type="button" class="topic '+(state.filters.topic===name?'active':'')+'" data-topic="'+esc(name)+'"><span>'+esc(name)+'</span><span>'+count+'</span></button>').join('')||'<div class="empty">沒有主題資料</div>';$('topics').querySelectorAll('[data-topic]').forEach(button=>button.onclick=()=>{state.filters.topic=state.filters.topic===button.dataset.topic?'':button.dataset.topic;state.filters.region='';state.filters.year='';state.page=1;refresh()})}
    function renderStats(f){$('stats').innerHTML='<div class="stat"><strong>'+f.total+'</strong><span>目前結果</span></div><div class="stat"><strong>'+(f.jurisdiction.TW||0)+'</strong><span>台灣</span></div><div class="stat"><strong>'+(f.jurisdiction.CN||0)+'</strong><span>中國大陸</span></div><div class="stat review"><strong>'+f.review+'</strong><span>待人工確認</span></div>'}
    function renderActive(){const entries=Object.entries(state.filters).filter(([key,value])=>value);$('activeFilter').innerHTML=entries.map(([key,value])=>'<span class="pill">'+esc(key==='q'?'搜尋：'+value:label(key,value))+' <button type="button" data-remove="'+key+'" aria-label="移除條件">×</button></span>').join('');$('activeFilter').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.filters[b.dataset.remove]='';if(b.dataset.remove==='q')$('q').value='';state.page=1;refresh()})}
    function renderResults(){const rows=state.results.slice((state.page-1)*pageSize,state.page*pageSize);$('summary').textContent='共 '+state.results.length+' 筆';$('results').innerHTML=rows.length?rows.map(x=>'<article class="result"><div class="result-title"><div><h3>'+esc(x.fileName)+'</h3><div class="tags"><span class="tag main">'+esc(x.jurisdiction==='TW'?'台灣':x.jurisdiction==='CN'?'中國大陸':'法域待確認')+'</span><span class="tag">'+esc(x.documentType)+'</span><span class="tag">'+esc(x.primaryTopic)+'</span>'+(x.region!=='地區待確認'?'<span class="tag">'+esc(x.region)+'</span>':'')+(x.year!=='年份待確認'?'<span class="tag">'+esc(x.year)+'</span>':'')+(x.classificationStatus==='needs_review'?'<span class="tag warn">待人工確認</span>':'')+'</div></div><button class="open" type="button" data-id="'+esc(x.documentId)+'">開啟原始檔</button></div><p class="path">'+esc(x.relativePath)+'</p><p class="meta">'+esc(x.extension.toUpperCase())+'　·　最後修改 '+esc(new Date(x.modifiedAt).toLocaleDateString('zh-TW'))+'　·　分類信心 '+esc(x.confidence)+'</p></article>').join(''):'<div class="empty">找不到符合條件的文件<br><small>可以清除篩選，或換一組關鍵字。</small></div>';$('results').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>window.open('/api/file?id='+encodeURIComponent(b.dataset.id),'_blank','noopener'));const pages=Math.ceil(state.results.length/pageSize);$('pager').innerHTML=pages>1?Array.from({length:pages},(_,i)=>'<button type="button" class="'+(state.page===i+1?'active':'')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>').join(''):'';$('pager').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);renderResults();window.scrollTo({top:$('results').offsetTop-20,behavior:'smooth'})})}
    async function refresh(){try{const query=params();const f=await get('/api/facets?'+query);renderStats(f);renderTopics(f.primaryTopic);populate('jurisdiction',f.jurisdiction,'全部法域');populate('documentType',f.documentType,'全部文件類型');populate('region',f.region,'全部地區／省份');populate('year',f.year,'全部年份');renderActive();state.results=(await get('/api/search?'+query)).results;renderResults()}catch(error){$('results').innerHTML='<div class="empty">資料載入失敗，請確認查詢服務是否正在執行。</div>';console.error(error)}}
    function clear(){state.filters={jurisdiction:'',documentType:'',topic:'',region:'',year:'',q:''};$('q').value='';state.page=1;refresh()}
    ['jurisdiction','documentType','region','year'].forEach(id=>$(id).addEventListener('change',()=>{state.filters[id]=$(id).value;state.page=1;refresh()}));$('searchForm').onsubmit=e=>{e.preventDefault();state.filters.q=$('q').value.trim();state.page=1;refresh()};$('clearBtn').onclick=clear;
    get('/api/health').then(h=>$('healthText').textContent='索引 '+h.indexed+' 筆').catch(()=>{$('healthText').textContent='服務未連線'});refresh();
  </script>
</body>
</html>
